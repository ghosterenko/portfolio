<!DOCTYPE html>

    <style>

            font-family: cr;
            src: url(../porrfolio/fonts/Cyrulik-Rounded.ttf);
        }
        @font-face {
            font-family: cs;
            src: url(../porrfolio/fonts/Cyrulik-Sharp.ttf);
        }
        @font-face {
            font-family: csb;
            src: url(../porrfolio/fonts/Cyrulik-SharpBold.ttf);
        }
        * {
            margin: 0;
            padding: 0;
            font-family: cr;
        }
        a {
            text-decoration: none;
            color: white;
            font-size: 18px; 
        }
        body {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background-color: rgb(39, 37, 37);
        }

</head>
<body>
    <header class="header">
        <nav class="nav-menu">
            <a id="main" href="#" class="nav-item">Главная</a>

        </nav>
        <style>
            .header {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 40px;
            }
            .nav-menu {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 60px;
            }
            .nav-item {
                transition: 1s;
            }
            .nav-item:hover {
                font-size: 32px;
                font-weight: bold;
            }
            
        </style>
    </header>
    <main class="main">

            .main {
                display: flex;

                gap: 20px;

                align-items: center;
            }
            .section {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                background-color: rgb(64, 64, 64);
                width: 100em;
                height: 50em;
                border-radius: 25px;
                color: white;
            }
        </style>  
    </main>
    <footer class="footer">
        <p>Ⓒcopyright</p>
        <p>89999999999</p>
        <style>
            .footer {
                height: 20vh;
                background-color: black;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                color: white;
                font-size: 24px;
                gap: 20px;
            }
